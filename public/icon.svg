<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#060a12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.12"/>

  <!-- Amber top bar -->
  <rect x="0" y="0" width="512" height="7" rx="110" fill="#f59e0b" opacity="0.95"/>
  <rect x="50" y="0" width="412" height="7" fill="#f59e0b" opacity="0.95"/>

  <!-- Upward arrow / trend — bold and simple -->
  <!-- Vertical bar of arrow -->
  <rect x="234" y="148" width="44" height="230" rx="22" fill="#f59e0b" filter="url(#softglow)"/>
  <!-- Arrow head pointing up -->
  <path d="M 160 240 L 256 120 L 352 240" fill="#f59e0b" stroke="#f59e0b" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Small chart bars bottom-left -->
  <rect x="100" y="350" width="36" height="90" rx="8" fill="#f59e0b" opacity="0.25"/>
  <rect x="148" y="310" width="36" height="130" rx="8" fill="#f59e0b" opacity="0.4"/>

  <!-- Small chart bars bottom-right -->
  <rect x="330" y="310" width="36" height="130" rx="8" fill="#f59e0b" opacity="0.4"/>
  <rect x="378" y="350" width="36" height="90" rx="8" fill="#f59e0b" opacity="0.25"/>
</svg>
