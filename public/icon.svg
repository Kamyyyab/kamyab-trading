<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1525"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle amber top line (Bloomberg style) -->
  <rect x="0" y="0" width="512" height="6" rx="108" fill="#f59e0b" opacity="0.9"/>
  <rect x="40" y="0" width="432" height="6" fill="#f59e0b" opacity="0.9"/>

  <!-- Faint grid lines -->
  <line x1="60" y1="200" x2="452" y2="200" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.04"/>
  <line x1="60" y1="280" x2="452" y2="280" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.04"/>
  <line x1="60" y1="360" x2="452" y2="360" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.04"/>

  <!-- Bar 1 — short -->
  <rect x="70" y="330" width="72" height="130" rx="10" fill="url(#bar1)"/>
  <!-- Bar 2 — medium -->
  <rect x="210" y="240" width="72" height="220" rx="10" fill="url(#bar2)"/>
  <!-- Bar 3 — tall, bright -->
  <rect x="350" y="135" width="72" height="325" rx="10" fill="url(#bar3)" filter="url(#softglow)"/>

  <!-- Trend line -->
  <path d="M 106 318 C 180 240 280 165 386 128"
    stroke="url(#line)" stroke-width="12" fill="none"
    stroke-linecap="round" filter="url(#glow)"/>

  <!-- Glowing dot at trend tip -->
  <circle cx="386" cy="127" r="26" fill="#f59e0b" opacity="0.18"/>
  <circle cx="386" cy="127" r="17" fill="#f59e0b" opacity="0.35"/>
  <circle cx="386" cy="127" r="10" fill="#fbbf24" filter="url(#glow)"/>
</svg>
